                "@type": "Question",

                  "@type": "Answer",

                }
              },
              {
                "@type": "Question",
                "name": "O que acontece com o meu ZIP?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ele é lido em memória para gerar o relatório e descartado na mesma requisição. Nada do arquivo é gravado."
